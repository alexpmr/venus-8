name: Build & Release Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Compile executable
        run: pyinstaller --noconfirm --clean --windowed --name Venus-8 --collect-all sounddevice --collect-all rtmidi --collect-all mido run.py
      - name: Build Windows installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=0.1.0" 'installer\venus8.iss'
      - name: Package portable edition
        shell: pwsh
        run: Compress-Archive -Path dist/Venus-8/* -DestinationPath dist/Venus-8-v0.1.0-Windows-Portable.zip
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Venus-8-v0.1.0-Windows
          path: |
            dist/Venus-8-v0.1.0-Windows-Setup.exe
            dist/Venus-8-v0.1.0-Windows-Portable.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create ${{ github.ref_name }} dist/Venus-8-v0.1.0-Windows-Setup.exe dist/Venus-8-v0.1.0-Windows-Portable.zip --title "Venus-8 ${{ github.ref_name }}" --notes "Primeiro protótipo funcional. Build automático; hardware Windows real ainda necessita validação."

      - name: Refresh README download counters for this release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git fetch origin main
          git checkout main
          python scripts/update_download_badges.py ${{ github.ref_name }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if (git diff --cached --quiet) { Write-Output 'README already up to date' } else { git commit -m "docs: point platform download counters at ${{ github.ref_name }}"; git push origin main }
