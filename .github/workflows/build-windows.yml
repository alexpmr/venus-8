name: Build & Release Windows
# PAUSED at user's request: automatic builds disabled.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: venus8-windows-release
  cancel-in-progress: true
jobs:
  windows:
    if: ${{ false }} # Paused: do not allocate a Windows runner
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Resolve application version
        shell: pwsh
        run: |
          $contents = Get-Content venus8/__init__.py -Raw
          $version = [regex]::Match($contents, '__version__\s*=\s*"(\d+\.\d+\.\d+)"').Groups[1].Value
          if (-not $version) { throw "Version not defined" }
          "VENUS_VERSION=$version" >> $env:GITHUB_ENV
          "VENUS_TAG=v$version" >> $env:GITHUB_ENV
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q venus8 tests run.py
      - name: Generate Venus-8 multiresolution icon
        shell: pwsh
        run: |
          python scripts/create_icon.py
          if (!(Test-Path assets/venus-8.ico)) { throw "Custom icon missing" }
      - name: Build executable for Windows setup
        run: pyinstaller --noconfirm --clean --windowed --name Venus-8 --collect-all sounddevice --collect-all rtmidi --collect-all mido --collect-all PIL --icon assets/venus-8.ico --add-data 'assets/venus-8.ico;assets' --add-data 'docs/venus-8-mockup.png;docs' run.py
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$env:VENUS_VERSION" 'installer\venus8.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Build single-file portable executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Venus-8-$env:VENUS_TAG-Windows-Portable" --collect-all sounddevice --collect-all rtmidi --collect-all mido --collect-all PIL --icon assets/venus-8.ico --add-data 'assets/venus-8.ico;assets' --add-data 'docs/venus-8-mockup.png;docs' run.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }
      - name: Verify files and generate SHA256SUMS
        shell: pwsh
        run: |
          $files = @("dist/Venus-8-$env:VENUS_TAG-Windows-Setup.exe", "dist/Venus-8-$env:VENUS_TAG-Windows-Portable.exe")
          $lines = @()
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing output: $file" }
            if ((Get-Item $file).Length -lt 100000) { throw "Invalid output: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $(Split-Path $file -Leaf)"
          }
          [System.IO.File]::WriteAllText("$pwd/dist/SHA256SUMS.txt", ($lines -join "`n")+"`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content dist/SHA256SUMS.txt
      - name: Upload Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Venus-8-Windows-${{ env.VENUS_TAG }}
          if-no-files-found: error
          path: |
            dist/Venus-8-*-Windows-Setup.exe
            dist/Venus-8-*-Windows-Portable.exe
            dist/SHA256SUMS.txt
      - name: Publish this version if not already published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:VENUS_TAG --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release already exists. Skipping to prevent silent replacement."
          } else {
            gh release create $env:VENUS_TAG "dist/Venus-8-$env:VENUS_TAG-Windows-Setup.exe" "dist/Venus-8-$env:VENUS_TAG-Windows-Portable.exe" dist/SHA256SUMS.txt --repo ${{ github.repository }} --target ${{ github.sha }} --title "Venus-8 $env:VENUS_TAG — Windows x64" --notes "Prévia Windows 10/11 x64. Inclui 14 timbres Factory originais inspirados em sintetizadores vintage, navegador por banco e categoria, três osciladores, filtro ressonante de quatro polos, envelope ADSR, MIDI USB, delay e atualização por GitHub Releases com SHA-256. Testes físicos no Windows ainda devem ser realizados." --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
          }
      - name: Refresh README download table from GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python scripts/update_release_table.py $env:VENUS_TAG
          if ($LASTEXITCODE -ne 0) { throw 'README generation failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if (git diff --cached --quiet) {
            Write-Output 'No README changes'
          } else {
            git commit -m "docs: Windows downloads for $env:VENUS_TAG [skip ci]"
            git push origin main
            if ($LASTEXITCODE -ne 0) { throw 'Cannot push README updates' }
          }
